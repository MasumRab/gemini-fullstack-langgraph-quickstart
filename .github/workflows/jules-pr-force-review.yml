name: Jules PR Force Review

# Same reviewer logic as jules-pr-review but manually triggered via label.
# Unlike the auto-reviewer, this one does NOT skip Jules-created PRs —
# if someone applies jules-force-review, they want a review regardless.

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: jules-force-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >
      github.event.label.name == 'jules-force-review' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER') &&
       startsWith(github.event.comment.body, '/jules-force-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: read
      statuses: write
    steps:
      - name: Consume label — prevent duplicate sessions
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'jules-force-review',
            }).catch(e => { if (e.status !== 404) throw e; core.info('Label already consumed'); });

      - name: Parse slash command context
        if: github.event_name == 'issue_comment'
        id: parse
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          CUSTOM=$(echo "$COMMENT_BODY" | sed 's|^/jules-force-review ||')
          echo "custom_instructions=$CUSTOM" >> "$GITHUB_OUTPUT"

      - name: Resolve PR from issue_comment
        if: github.event_name == 'issue_comment'
        id: resolve-pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            core.setOutput('head_repo', pr.head.repo.full_name);
            core.setOutput('base_repo', pr.base.repo.full_name);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('number', String(pr.number));

      - name: Fork check
        id: fork-check
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || steps.resolve-pr.outputs.head_repo }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name || steps.resolve-pr.outputs.base_repo }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.fork-check.outputs.skip != 'true'
        with:
          ref: ${{ steps.resolve-pr.outputs.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout helper scripts (trusted base branch)
        if: steps.fork-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || steps.resolve-pr.outputs.base_ref }}
          sparse-checkout: |
            .github/scripts
          path: _helpers

      - name: Prepare review prompt
        id: prepare
        env:
          CUSTOM_INSTRUCTIONS: ${{ steps.parse.outputs.custom_instructions }}
        uses: actions/github-script@v7
        with:
          script: |
            if ('${{ steps.fork-check.outputs.skip }}' === 'true') {
              core.setOutput('skip', 'true');
              return;
            }

            let pr;
            if (context.eventName === 'issue_comment') {
              if (!context.payload.issue?.pull_request) {
                core.setOutput('skip', 'true');
                return;
              }
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              pr = data;
            } else {
              pr = context.payload.pull_request;
            }
            const baseRef = pr.base.ref;
            const headSha = pr.head.sha;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const fileSummary = files.map(f => ({
              path: f.filename, status: f.status,
              additions: f.additions, deletions: f.deletions,
            }));

            const allIssueComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existingReview = allIssueComments.find(c =>
              c.body?.includes('<!-- jules-force-review -->') &&
              c.body?.includes(`head_sha:${headSha}`)
            );
            if (existingReview) {
              core.info('Force review already posted for this HEAD SHA — skipping');
              core.setOutput('skip', 'true');
              return;
            }

            const fs = require('fs');
            const classifierPath = './_helpers/.github/scripts/jules-comment-classifier.cjs';
            let priorFeedback = '';
            let priorReviews = '';
            let hasWalkthrough = false;
            if (fs.existsSync(classifierPath)) {
              const { classifyAndFilter } = require(classifierPath);
              const result = await classifyAndFilter(github, context.repo.owner, context.repo.repo, pr.number, {
                includeReviewComments: true,
                includeReviews: false,
                includeThreads: false,
                includeWalkthrough: false,
                maxComments: 10,
                maxBodyLength: 300,
              });
              priorFeedback = result.priorFeedback;
              priorReviews = result.priorReviews;
              hasWalkthrough = result.hasWalkthrough;
            } else {
              core.warning('jules-comment-classifier.cjs not found in base branch — proceeding without prior comment context');
            }

            // Load repo-specific instructions from base branch (trusted)
            let reviewRules = '';
            for (const path of ['.jules/INSTRUCTIONS.md', '.github/jules-review-rules.md']) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner, repo: context.repo.repo,
                  path, ref: baseRef,
                });
                reviewRules = Buffer.from(data.content, 'base64').toString('utf8');
                break;
              } catch (e) { /* file is optional */ }
            }

            // Linked issue analysis
            let linkedIssue = '';
            const issueMatch = pr.body?.match(/(?:Fixes|Closes|Resolves|Fix|Close|Resolve)\s+#(\d+)/i);
            if (issueMatch) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(issueMatch[1]),
                });
                linkedIssue = `## Linked Issue\n\n#${issue.number}: ${issue.title}\n${issue.body?.slice(0, 1000) || ''}`;
              } catch (e) { /* issue may be private or deleted */ }
            }

            const customInstr = process.env.CUSTOM_INSTRUCTIONS || '';
            const prompt = [
              ...(customInstr ? [`## User instructions`, customInstr, ``] : []),
              `## Code Review Request (Force Review)`,
              ``,
              `Repository: ${context.repo.owner}/${context.repo.repo}`,
              `Title: ${pr.title}`,
              `Target branch: ${baseRef}`,
              `PR head branch: ${pr.head.ref}`,
              `PR head SHA: ${headSha}`,
              `Files changed: ${files.length} (${files.reduce((s, f) => s + f.additions + f.deletions, 0)} +/-)`,
              ``,
              `## Changed files (names only — no content)`,
              JSON.stringify(fileSummary, null, 2),
              ...(priorFeedback ? [``, `## Existing PR comments`, priorFeedback] : []),
              ...(priorReviews ? [``, `## Existing review comments`, priorReviews] : []),
               ...(reviewRules ? [``, `## Repository-specific instructions`, reviewRules] : []),
               ...(linkedIssue ? [``, linkedIssue] : []),
              ``,
              `## Your task`,
              `This is a read-only code review. Do NOT create any pull requests or modify code.`,
              `Review the code changes using the file-list-first approach:`,
              `1. Review the file list above — identify relevant files`,
              `2. Group them by directory or thematic area (e.g., API, Database, Frontend)`,
              `3. For each relevant file, run: git diff origin/${baseRef}...HEAD -- <filepath>`,
              `4. Read existing PR/review comments above — build on prior context`,
              `5. If a linked issue is provided, assess whether this PR addresses it`,
              `6. Run security analysis using pre-installed tools:`,
              `   - Python: \`ruff check --select ALL .\` (ruff is pre-installed)`,
              `   - JavaScript: \`eslint .\` (eslint is pre-installed)`,
              `   - Include any security findings classified by severity`,
              `7. Examine logic, edge cases, and consistency`,
              ``,
              `## Output format`,
              `Produce the review EXACTLY in this structure. Keep every element shown below`,
              `including HTML comments and XML-like tags — they are required for parsing.`,
              `Replace placeholders (e.g. <description>) with your analysis.`,
              ``,
              '## Summary',
              '<1-2 paragraphs — what this PR does and whether it is sound>',
              '',
              '## Strengths',
              '- <point form: what is done well>',
              '',
              '## Findings',
              'If no issues found, write: "No significant findings."',
              '',
              '### 🔴 Critical - <path/file.ext:line> — <description>',
              '<1-2 sentences. MUST fix before merge — production failure, security breach, data corruption.>',
              'If a code change is suggested:',
              '````',
              '```suggestion',
              '<replacement code>',
              '```',
              '````',
              '<details>',
              '<summary>🤖 AI reasoning</summary>',
              '',
              '<brief explanation of the logic that produced this finding>',
              '</details>',
              '<!-- FINDING severity="critical" file="src/auth.py" line="42" reason="security" -->',
              '',
              '### 🟠 High - <path/file.ext:line> — <description>',
              '<should fix before merge — significant problems, bugs, performance degradation. If suggestion:>',
              '````',
              '```suggestion',
              '<code>',
              '```',
              '````',
              '<details><summary>🤖 AI reasoning</summary><explanation></details>',
              '<!-- FINDING severity="high" file="..." line="..." reason="..." -->',
              '',
              '### 🟡 Medium - <path/file.ext:line> — <description>',
              '<deviation from best practices, technical debt. Consider fixing.>',
              '<!-- FINDING severity="medium" file="..." line="..." -->',
              '',
              '### 🟢 Low - <path/file.ext:line> — <description>',
              '<minor, stylistic, typos, docs. Author discretion.>',
              '<!-- FINDING severity="low" file="..." line="..." -->',
              '',
              '## Truncation',
              'If nearing timeout or output exceeds length limits, truncate findings gracefully.',
              'Summarize remaining issues. Set verdict block if critical remain, comment if minor.',
              'Add: <!-- meta-prompt: truncated due to limits -->',
              '',
              '## Verdict',
              '[VERDICT]: <approve|comment|block>',
              '',
              '<!-- verdict: approve | comment | block -->',
              '',
              '<details>',
              '<summary>🤖 Prompt for AI Agents — implement all per-line changes</summary>',
              '',
              'This PR review identified findings that need to be addressed.',
              'Each per-line comment above includes a specific issue with a code suggestion.',
              'To implement all changes:',
              '1. Read each per-line comment with its ```suggestion block',
              '2. Apply each suggestion at the specified file and line',
              '3. Verify no regressions are introduced',
              '4. Commit and push the fixes',
              '',
              'Or apply the jules-fix label to this PR for an automated fix PR.',
              '',
              '</details>',
            ].join('\n');

            const payload = {
              prompt,
              sourceContext: {
                source: `sources/github/${context.repo.owner}/${context.repo.repo}`,
                githubRepoContext: { startingBranch: pr.head.ref },
              },
            };

            const fs = require('fs');
            fs.writeFileSync('/tmp/jules-force-review-payload.json', JSON.stringify(payload));
            core.setOutput('head_sha', headSha);
            core.info(`Force-review payload written for PR #${pr.number}`);

      - name: Skip (fork)
        if: steps.prepare.outputs.skip == 'true'
        shell: bash
        run: echo "Skipped — fork PR (no secret access)"

      - name: Create Jules session
        if: steps.prepare.outputs.skip != 'true'
        id: create
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          retry_curl() {
            local response curl_exit error_code attempt
            for attempt in 1 2 3; do
              set +e
              response=$(curl -sS --fail-with-body --connect-timeout 10 --max-time 60 "$@")
              curl_exit=$?
              set -e
              if [ $curl_exit -eq 0 ]; then
                printf '%s' "$response"
                return 0
              fi
              error_code=$(echo "$response" | jq -r '.error.code // "0"' 2>/dev/null)
              if [ $attempt -lt 3 ] && { [ $curl_exit -ne 22 ] || [ "$error_code" -ge 500 ] 2>/dev/null; }; then
                sleep $((2 ** (attempt - 1)))
                continue
              fi
              printf '%s' "$response"
              return $curl_exit
            done
          }

          set +e
          RESPONSE=$(retry_curl \
            -X POST "https://jules.googleapis.com/v1alpha/sessions" \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: ${JULES_API_KEY}" \
            -d @/tmp/jules-force-review-payload.json)
          CURL_EXIT=$?
          set -e

          if [ $CURL_EXIT -ne 0 ]; then
            ERROR_CODE=$(echo "$RESPONSE" | jq -r '.error.code // "0"')
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // ""')
            if [ "$ERROR_CODE" = "429" ] || echo "$ERROR_MSG" | grep -qiE 'quota (has been )?exceeded|daily (request |session )?(quota|limit)|resource_exhausted'; then
              echo "quota_exhausted=true" >> "$GITHUB_OUTPUT"
              echo "⚠️ Session cap reached — no session created."
              exit 0
            fi
            if [ "$ERROR_CODE" = "403" ]; then
              echo "::warning::Jules API returned 403; check API key permissions and service access."
            fi
            echo "Error: $RESPONSE"
            exit 1
          fi

          SESSION_NAME=$(echo "$RESPONSE" | jq -r '.name // empty')
          SESSION_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          STATE=$(echo "$RESPONSE" | jq -r '.state // empty')

          if [ -z "$SESSION_NAME" ] && [ -z "$SESSION_ID" ]; then
            echo "Error: $RESPONSE"
            exit 1
          fi

          echo "session_name=$SESSION_NAME" >> "$GITHUB_OUTPUT"
          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
          echo "Session created: $SESSION_NAME (state: $STATE)"

      - name: Notify session cap reached
        if: steps.create.outputs.quota_exhausted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '⚠️ **Jules session cap reached (15/day).**\n\nForce-review cannot run today. Re-apply the `jules-force-review` label tomorrow to retry.\n\n<!-- jules-quota-exhausted -->',
            });

      - name: Poll for completion
        if: steps.prepare.outputs.skip != 'true' && steps.create.outputs.quota_exhausted != 'true'
        id: poll
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_NAME: ${{ steps.create.outputs.session_name }}
          SESSION_ID: ${{ steps.create.outputs.session_id }}
        run: |
          curl_with_retry() {
            local response curl_exit attempt
            for attempt in 1 2; do
              set +e
              response=$(curl -sS --fail-with-body --connect-timeout 10 --max-time 60 "$@")
              curl_exit=$?
              set -e
              if [ $curl_exit -eq 0 ]; then
                printf '%s' "$response"
                return 0
              fi
              if [ $attempt -eq 1 ]; then
                echo "Transient Jules API error; retrying once" >&2
                sleep 2
              fi
            done
            printf '%s' "$response"
            return $curl_exit
          }

          SESSION_RESOURCE="${SESSION_NAME:-sessions/${SESSION_ID}}"
          MAX_ATTEMPTS=60

          for i in $(seq 1 $MAX_ATTEMPTS); do
            sleep 15
            RESPONSE=$(curl_with_retry \
              "https://jules.googleapis.com/v1alpha/${SESSION_RESOURCE}?view=FULL" \
              -H "X-Goog-Api-Key: ${JULES_API_KEY}")
            STATE=$(echo "$RESPONSE" | jq -r '.state // "UNKNOWN"')

            if [ "$STATE" = "COMPLETED" ] || [ "$STATE" = "FAILED" ]; then
              echo "session_state=$STATE" >> "$GITHUB_OUTPUT"
              ACTS=$(curl_with_retry \
                "https://jules.googleapis.com/v1alpha/${SESSION_RESOURCE}/activities?pageSize=100" \
                -H "X-Goog-Api-Key: ${JULES_API_KEY}")
              echo "$ACTS" | jq -r '[
                (.activities // [])[]
                | select(.agentMessaged.agentMessage != null)
                | .agentMessaged.agentMessage
              ] | join("\n\n---\n\n") // "Review unavailable"' > /tmp/jules-force-review-output.txt
              echo "Session finished ($STATE)"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS — state: $STATE"
          done

          echo "session_state=TIMEOUT" >> "$GITHUB_OUTPUT"
          echo "Force-review timed out." > /tmp/jules-force-review-output.txt

      - name: Post review and set commit status
        if: always() && steps.prepare.conclusion == 'success' && steps.prepare.outputs.skip != 'true' && steps.create.outputs.quota_exhausted != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reviewText = 'Review unavailable';
            try {
              reviewText = fs.readFileSync('/tmp/jules-force-review-output.txt', 'utf8');
            } catch (e) {
              core.warning(`Output file not found: ${e.message}`);
            }
            const prNumber = context.payload.pull_request?.number || context.payload.issue.number;
            const headSha = '${{ steps.prepare.outputs.head_sha }}';
            const sessionState = '${{ steps.poll.outputs.session_state }}';

            const verdictMatch = reviewText.match(/\[VERDICT\]:\s*(approve|comment|block)|<!--\s*verdict:\s*(approve|comment|block)\s*-->/i);
            const verdict = verdictMatch ? (verdictMatch[1] || verdictMatch[2]).toLowerCase() : null;

            // Determine commit status — fail closed
            let statusState = 'failure';
            let statusDesc = 'Review failed';
            if (sessionState === 'COMPLETED' && verdict === 'approve') {
              statusState = 'success';
              statusDesc = 'Approved';
            } else if (sessionState === 'COMPLETED' && verdict === 'comment') {
              statusState = 'neutral';
              statusDesc = 'Comments provided';
            } else if (sessionState === 'COMPLETED' && verdict === 'block') {
              statusState = 'failure';
              statusDesc = 'Blocking issues found';
            } else if (sessionState === 'FAILED') {
              statusState = 'failure';
              statusDesc = 'Jules session failed';
            } else if (sessionState === 'TIMEOUT') {
              statusState = 'failure';
              statusDesc = 'Review timed out';
            }

            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: statusState,
                context: 'jules/review',
                description: statusDesc,
              });
            } catch (e) {
              core.warning(`Failed to set commit status: ${e.message}`);
            }

            // Parse per-line findings from Jules output
            const findingRegex = /<!--\s*FINDING\s+severity="([^"]+)"\s+file="([^"]+)"\s+line="?(\d+)"?(?:\s+reason="([^"]*)")?\s*-->/gi;
            const comments = [];
            let findingMatch;
            const seen = new Set();
            while ((findingMatch = findingRegex.exec(reviewText)) !== null) {
              const [, severity, file, line, reason] = findingMatch;
              const key = `${file}:${line}`;
              if (seen.has(key)) continue;
              seen.add(key);

              const severityEmoji = severity === 'critical' ? '🔴' : severity === 'high' ? '🟠' : severity === 'medium' ? '🟡' : '🟢';
              const heading = `### ${severityEmoji} ${severity.charAt(0).toUpperCase() + severity.slice(1)} - ${file}:${line}`;
              const startIdx = reviewText.indexOf(heading);
              const endIdx = reviewText.indexOf('<!-- FINDING', startIdx + 1);
              const findingBody = startIdx !== -1
                ? reviewText.slice(startIdx, endIdx !== -1 ? endIdx : undefined).trim()
                : '';

              comments.push({
                path: file,
                line: parseInt(line),
                body: findingBody || `${heading}\n\nSee review summary for details.`,
              });
            }

            const body = `<!-- jules-force-review -->\n<!-- head_sha: ${headSha} -->\n<!-- head_sha:${headSha} -->\n\n${reviewText}`;

            try {
              let reviewEvent = 'COMMENT';
              if (verdict === 'approve') reviewEvent = 'APPROVE';
              else if (verdict === 'block') reviewEvent = 'REQUEST_CHANGES';
              const reviewParams = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                commit_id: headSha,
                event: reviewEvent,
                body,
              };
              if (comments.length > 0) {
                reviewParams.comments = comments;
              }
              await github.rest.pulls.createReview(reviewParams);
              core.info(`Review posted with ${comments.length} per-line comments`);
            } catch (e) {
              core.warning(`PR review failed, falling back to issue comment: ${e.message}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Upload session output
        if: always() && steps.prepare.outputs.skip != 'true' && steps.create.outputs.quota_exhausted != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jules-force-review-${{ github.event.pull_request.number }}
          path: /tmp/jules-force-review-output.txt
          retention-days: 30

      - name: Remove jules-force-review label
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.payload.issue.number;
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              name: 'jules-force-review',
            }).catch(e => { if (e.status !== 404) throw e; core.warning('Label already removed'); });
